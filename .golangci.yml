version: "2"
run:
  relative-path-mode: gitroot
linters:
  enable:
    - gocritic
    - revive
    - staticcheck
    - godoclint
    - godot
    - intrange
    - lll
    - misspell
    - perfsprint
    - testifylint
    - tparallel
  settings:
    gocritic:
      disable-all: true
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          failOn: dsl,import
          rules: '${base-path}/.ruleguard/rules.go'
    staticcheck:
      checks:
        - all
      dot-import-whitelist:
        - "github.com/paulsonkoly/chess-3/chess"
    revive:
      rules:
        - name: dot-imports
          severity: warning
          disabled: false
          exclude: [""]
          arguments:
            - allowed-packages: ["github.com/paulsonkoly/chess-3/chess"]
  exclusions:
    generated: lax
    rules:
      - path: '^tools/'
        linters:
          - gocritic
      - path: '^eval/coeffs\.go$'
        linters:
          - gocritic
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
